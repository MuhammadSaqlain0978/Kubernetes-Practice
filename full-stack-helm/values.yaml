frontend:
  replicas: 2

  image:
    # Must match what you push to ECR (see commands.txt)
    repository: full-stack-frontend
    tag: "frontend-1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi


backend:
  replicas: 2

  image:
    repository: full-stack-backend
    tag: "backend-1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 50


mongodb:
  replicaCount: 1

  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  auth:
    username: ""
    password: ""

  service:
    port: 27017

  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
    accessMode: ReadWriteOnce


ingress:
  enabled: false

  className: nginx

  host: full-stack.local

  tls:
    enabled: false
    secretName: ""


certManager:
  enabled: false
  clusterIssuer: ""


gateway:
  enabled: true
  gatewayClassName: eg
  host: full-stack.local

  tls:
    enabled: false
    tlsSecretName: ""


envoyProxy:
  enabled: true
  namespace: envoy-gateway-system
  service:
    type: NodePort


otel:
  # Namespace where kube-prometheus-stack (Prometheus Operator) runs — the
  # ServiceMonitor/PodMonitor must be placed there to be picked up
  prometheusNamespace: observability

  serviceMonitor:
    enabled: true

  podMonitor:
    enabled: false # alternative to serviceMonitor — enable one, not both

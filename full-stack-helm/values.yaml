frontend:
  replicas: 2

  image:
    repository: full-stack-frontend
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80


backend:
  replicas: 2

  image:
    repository: full-stack-backend
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 50


mongodb:
  replicaCount: 1

  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent

  service:
    port: 27017

  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
    accessMode: ReadWriteOnce


ingress:
  enabled: false

  className: nginx

  host: full-stack.local

  tls:
    enabled: false
    secretName: ""


certManager:
  enabled: false
  clusterIssuer: ""


gateway:
  enabled: true
  gatewayClassName: eg
  host: full-stack.local

  tls:
    enabled: false
    tlsSecretName: ""


envoyProxy:
  service:
    type: NodePort
# =============================================================================
# generic-chart — deploy ONE service (one release) by changing ONLY values.
# Every block is optional: leave it off and nothing renders.
# Unknown keys are rejected by values.schema.json, so typos fail loudly.
# See README.md for the full reference.
# =============================================================================

nameOverride: ""       # replaces the chart name in <release>-<name>
fullnameOverride: ""   # set for short resource names (e.g. "demo" -> demo-app)

# --- Shared config for all workloads in this release -------------------------
configMap:
  enabled: false
  data: {}             # KEY: value (strings; pods receive them as env via envFromConfigMap)

secret:
  create: false        # chart renders <fullname>-secret from data
  data: {}             # NEVER put real values here — pass with --set secret.data.KEY=...
  existing: ""         # OR use a Secret created elsewhere (External Secrets, Vault...)

# --- ServiceAccount every pod in the release runs as --------------------------
serviceAccount:
  create: false        # true = chart creates <fullname> (or `name`)
  name: ""             # create=false: an existing SA to use ("" = namespace default)
  annotations: {}      # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>  (IRSA)
  automountServiceAccountToken: false   # true only if the app calls the Kubernetes API

# --- Release-wide pod defaults (apps, jobs, cronJobs) --------------------------
# Any entry can set the same key to replace the default for itself
# (replace, not merge — set `{}` / `[]` to opt out).
defaults:
  podSecurityContext: {}   # pod-level, e.g. { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
  securityContext: {}      # container-level, e.g. { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
  imagePullSecrets: []     # e.g. [{ name: regcred }]
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Workloads: one entry = one workload. "service.enabled" adds a Service ----
# Key name becomes the component label and the resource-name suffix.
apps: {}
  # app:
  #   enabled: true
  #   kind: Deployment         # Deployment (default) | StatefulSet | DaemonSet
  #   replicas: 2              # ignored for DaemonSet (one pod per node)
  #   persistence:             # StatefulSet only — one PVC per pod
  #     size: 1Gi
  #     mountPath: /data       # required when persistence is set
  #     storageClass: ""       # empty = cluster default
  #     accessMode: ReadWriteOnce
  #   image: nginx:1.27-alpine     # full "repo:tag" string (registry/repo:tag or @sha256 digest also fine)
  #   imagePullPolicy: IfNotPresent
  #   port: 80
  #   command: []            # optional
  #   args: []               # optional
  #   env: { FOO: bar }      # plain values
  #   envValueFrom:          # valueFrom refs (secretKeyRef / configMapKeyRef / fieldRef)
  #   envFromConfigMap: true # inject ALL chart configmap keys as env
  #   envFromSecret: true    # inject ALL chart secret keys as env
  #   probes:                # raw k8s probe objects
  #     readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3 }
  #     livenessProbe:  { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
  #   resources: { requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi} }
  #   annotations: {}        # pod annotations
  #   podSecurityContext: {} # override defaults.* for this app (same for the keys below)
  #   securityContext: {}
  #   nodeSelector: {}
  #   tolerations: []
  #   affinity: {}
  #   imagePullSecrets: []
  #   service:
  #     enabled: true
  #     type: ClusterIP
  #     port: 80           # defaults to app port
  #     portName: http     # used by ServiceMonitor endpoint matching

# --- Jobs (one-shot, or Helm hooks) ---------------------------------------------
# Map keyed by job name (becomes <fullname>-<name>). Jobs and cronJobs take the
# SAME pod fields as apps (image, imagePullPolicy, command, args, env,
# envValueFrom, envFromConfigMap, envFromSecret, resources, annotations and the
# defaults.* overrides) — no port/probes/service.
jobs: {}
  # seed:
  #   enabled: true
  #   image: busybox:1.36
  #   command: []
  #   backoffLimit: 2
  #   restartPolicy: Never
  #   ttlSecondsAfterFinished: 600   # default for plain jobs (re-runs on upgrade)
  # migrate:
  #   enabled: true
  #   image: busybox:1.36
  #   envFromSecret: true
  #   hook: pre-install,pre-upgrade                          # omit for a plain Job
  #   hookWeight: 0                                          # lower runs first
  #   hookDeletePolicy: before-hook-creation,hook-succeeded  # default
  # Any enabled pre-* hook job turns the chart ConfigMap/Secret/ServiceAccount
  # into pre-install hooks (weight -10) so they exist before the job runs. Hook
  # resources are not removed by "helm uninstall".

# --- CronJobs: one entry = one CronJob ------------------------------------------
cronJobs: {}
  # cleanup:
  #   enabled: true
  #   schedule: "*/5 * * * *"        # required
  #   timeZone: ""                   # e.g. Europe/Berlin
  #   concurrencyPolicy: Forbid      # Allow | Forbid | Replace
  #   suspend: false
  #   successfulJobsHistoryLimit: 3
  #   failedJobsHistoryLimit: 1
  #   backoffLimit: 2
  #   image: busybox:1.36
  #   command: []

# --- Ingress (nginx-style). Mutually exclusive with httpRoute in practice -------
ingress:
  enabled: false
  className: nginx
  host: app.local
  annotations: {}
  tls: []              # e.g. [{hosts: [app.local], secretName: app-tls}]
  paths: []
    # - { path: /, service: app, port: 80 }
    # - { path: /api, service: app, port: 8000 }

# --- ServiceMonitor (Prometheus Operator) ----------------------------------------
serviceMonitor:
  enabled: false
  portName: http       # must match a Service portName
  path: /metrics
  interval: 30s
  additionalLabels: {} # e.g. release: kube-prometheus-stack (required for that stack to pick it up)

# --- Envoy Gateway routing (attaches to the EXISTING platform Gateway) ------------
httpRoute:
  enabled: false
  parentName: ""       # name of the platform Gateway
  parentNamespace: ""  # namespace the platform Gateway lives in
  sectionName: http
  hostnames: [app.local]
  backends: []
    # - { path: /, service: app, port: 80 }
    # - { path: /api, service: app, port: 8000 }

backendTrafficPolicy:
  enabled: false       # only renders when httpRoute.enabled (it targets the route)
  timeout: ""          # e.g. 5s
  rateLimit:
    type: Local        # Local (no extra infra, blocks reliably) | Global (needs ratelimit service)
    requests: 100
    unit: Minute

securityPolicy:
  enabled: false       # only renders when httpRoute.enabled
  allowOrigins: ["http://app.local"]
  allowMethods: []     # defaults: GET POST PUT DELETE
  allowHeaders: []     # defaults: Authorization, Content-Type

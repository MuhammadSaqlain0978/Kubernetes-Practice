{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "generic-chart.metadata" (dict "root" . "name" "config" "annotations" (include "generic-chart.preHookAnnotations" . | fromYaml)) | nindent 2 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- if .Values.hooks.preInstall.enabled }}
{{- if not .Values.hooks.preInstall.image }}
{{- fail "hooks.preInstall.image is required when hooks.preInstall.enabled=true" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "generic-chart.fullname" . }}-pre-install
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-install-hook
  annotations:
    # Helm runs hook resources first, in weight order, and blocks the rest of
    # the install until they succeed — that's what guarantees "migration
    # before the app starts".
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.hooks.preInstall.backoffLimit | default 2 }}
  template:
    metadata:
      labels:
        {{- include "generic-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pre-install-hook
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: "{{ .Values.hooks.preInstall.image }}:{{ .Values.hooks.preInstall.tag | default "latest" }}"
          {{- with .Values.hooks.preInstall.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hooks.preInstall.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

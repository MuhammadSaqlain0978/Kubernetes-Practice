{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "generic-chart.fullname" . }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentName | required "httpRoute.parentName (the shared platform Gateway)" }}
      {{- with .Values.httpRoute.parentNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.httpRoute.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- range .Values.httpRoute.backends }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | default "/" }}
      backendRefs:
        - name: {{ include "generic-chart.fullname" $ }}-{{ .service }}
          port: {{ .port }}
    {{- end }}
{{- end }}

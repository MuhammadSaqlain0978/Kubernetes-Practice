{{- if .Values.secret.create }}
{{- if .Values.secret.existing }}
{{- fail "set either secret.create (chart renders the Secret) or secret.existing (use a Secret created elsewhere), not both" }}
{{- end }}
{{- if not .Values.secret.data }}
{{- fail "secret.create is true but secret.data is empty — pass credentials with --set secret.data.KEY=... (never commit real values)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "generic-chart.metadata" (dict "root" . "name" "secret" "annotations" (include "generic-chart.preHookAnnotations" . | fromYaml)) | nindent 2 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

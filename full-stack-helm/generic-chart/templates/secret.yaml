{{- if .Values.secret.create }}
{{- if not .Values.secret.data }}
{{- fail "secret.create is true but secret.data is empty — pass credentials with --set secret.data.KEY=... (never commit real values)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-chart.fullname" . }}-secret
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

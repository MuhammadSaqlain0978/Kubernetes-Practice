{{- if and .Values.backendTrafficPolicy.enabled .Values.httpRoute.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  {{- include "generic-chart.metadata" (dict "root" .) | nindent 2 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "generic-chart.fullname" . }}
  {{- with .Values.backendTrafficPolicy.timeout }}
  timeout: {{ . }}
  {{- end }}
  {{- with .Values.backendTrafficPolicy.rateLimit }}
  {{- if not (has .type (list "Local" "Global")) }}
  {{- fail (printf "backendTrafficPolicy.rateLimit.type must be Local or Global (got %q)" .type) }}
  {{- end }}
  rateLimit:
    type: {{ .type }}
    {{ .type | lower }}:
      rules:
        - limit:
            requests: {{ .requests }}
            unit: {{ .unit | default "Minute" }}
  {{- end }}
{{- end }}

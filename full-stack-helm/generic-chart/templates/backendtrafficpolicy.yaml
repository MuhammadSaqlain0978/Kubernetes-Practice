{{- if and .Values.backendTrafficPolicy.enabled .Values.httpRoute.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "generic-chart.fullname" . }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "generic-chart.fullname" . }}
  {{- with .Values.backendTrafficPolicy.timeout }}
  timeout: {{ . }}
  {{- end }}
  {{- with .Values.backendTrafficPolicy.rateLimit }}
  rateLimit:
    type: {{ .type }}
    {{- if eq .type "Local" }}
    local:
      rules:
        - limit:
            requests: {{ .requests }}
            unit: {{ .unit | default "Minute" }}
    {{- else if eq .type "Global" }}
    global:
      rules:
        - limit:
            requests: {{ .requests }}
            unit: {{ .unit | default "Minute" }}
    {{- end }}
  {{- end }}
{{- end }}

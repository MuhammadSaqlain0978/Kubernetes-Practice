{{- if .Values.cronjob.enabled }}
{{- if not .Values.cronjob.image }}
{{- fail "cronjob.image is required when cronjob.enabled=true" }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "generic-chart.fullname" . }}-{{ .Values.cronjob.name | default "cleanup" }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob
spec:
  schedule: {{ .Values.cronjob.schedule | default "*/5 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "generic-chart.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          containers:
            - name: cron
              image: "{{ .Values.cronjob.image }}:{{ .Values.cronjob.tag | default "latest" }}"
              {{- with .Values.cronjob.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.cronjob.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}

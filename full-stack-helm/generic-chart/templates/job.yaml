{{- if .Values.job.enabled }}
{{- if not .Values.job.image }}
{{- fail "job.image is required when job.enabled=true" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "generic-chart.fullname" . }}-{{ .Values.job.name | default "seed" }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
spec:
  backoffLimit: {{ .Values.job.backoffLimit | default 2 }}
  template:
    metadata:
      labels:
        {{- include "generic-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: job
    spec:
      restartPolicy: {{ .Values.job.restartPolicy | default "Never" }}
      containers:
        - name: job
          image: "{{ .Values.job.image }}:{{ .Values.job.tag | default "latest" }}"
          {{- with .Values.job.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.job.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

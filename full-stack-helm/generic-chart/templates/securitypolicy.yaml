{{- if and .Values.securityPolicy.enabled .Values.httpRoute.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "generic-chart.fullname" . }}
  labels:
    {{- include "generic-chart.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "generic-chart.fullname" . }}
  cors:
    allowOrigins:
      {{- range .Values.securityPolicy.allowOrigins }}
      - {{ . | quote }}
      {{- end }}
    allowMethods:
      {{- range .Values.securityPolicy.allowMethods | default (list "GET" "POST" "PUT" "DELETE") }}
      - {{ . }}
      {{- end }}
    allowHeaders:
      {{- range .Values.securityPolicy.allowHeaders | default (list "Authorization" "Content-Type") }}
      - {{ . }}
      {{- end }}
{{- end }}

{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled (($app.service).enabled) }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "generic-chart.metadata" (dict "root" $ "name" $name "component" $name) | nindent 2 }}
spec:
  type: {{ $app.service.type | default "ClusterIP" }}
  selector:
    {{- include "generic-chart.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: {{ $app.service.portName | default "http" }}
      port: {{ $app.service.port | default $app.port }}
      targetPort: {{ $app.port }}
{{- end }}
{{- end }}

apiVersion: v2
name: generic-chart
description: >-
  Central chart: one release = one service, configured only by its values file.
  Keyed maps (the key "default" = no name suffix) for workloads with any number
  of containers, Services, HPAs, Jobs / Helm hook Jobs, CronJobs, helm tests,
  ConfigMaps (env or files), Secrets, ExternalSecrets, PVCs, ServiceAccount,
  Ingresses, ServiceMonitor and Envoy Gateway routing (HTTPRoutes +
  BackendTrafficPolicies + SecurityPolicies). Gateway-class resources live in
  the separate platform-gateway chart.
type: application
version: 0.2.0
appVersion: "1.0"

apiVersion: v2
name: generic-chart
description: >-
  A reusable chart that deploys any number of app workloads (Deployments,
  StatefulSets, DaemonSets), Jobs / Helm hook Jobs and CronJobs from values
  only — all sharing one pod spec — with optional Services, ConfigMap,
  Secret (or an existing one), ServiceAccount, Ingress, ServiceMonitor, and Envoy Gateway routing
  (HTTPRoute + BackendTrafficPolicy + SecurityPolicy). Gateway-class resources
  (GatewayClass/Gateway/EnvoyProxy/ClientTrafficPolicy) live in the separate
  platform-gateway chart.
type: application
version: 0.2.0
appVersion: "1.0"

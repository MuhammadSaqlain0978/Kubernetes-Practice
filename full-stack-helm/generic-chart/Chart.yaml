apiVersion: v2
name: generic-chart
description: >-
  A reusable chart that deploys any set of app workloads (web app, worker, cache...)
  from values only — with optional Services, ConfigMap/Secret, Job, CronJob,
  pre-install hook, Ingress, ServiceMonitor, and Envoy Gateway routing
  (HTTPRoute + BackendTrafficPolicy + SecurityPolicy). Gateway-class resources
  (GatewayClass/Gateway/EnvoyProxy/ClientTrafficPolicy) live in the separate
  platform-gateway chart.
type: application
version: 0.1.0
appVersion: "1.0"

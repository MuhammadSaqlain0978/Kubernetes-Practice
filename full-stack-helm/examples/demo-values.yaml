# Demo stack exercising every generic-chart feature at once.
# Install with:
#   helm install demo ../generic-chart -n demo --create-namespace \
#     -f demo-values.yaml --set secret.data.DB_PASSWORD=demopass
fullnameOverride: demo

configMap:
  enabled: true
  data:
    APP_ENV: demo
    LOG_LEVEL: info

secret:
  create: true
  data: {}   # DB_PASSWORD comes from --set (never committed)

serviceAccount:
  create: true                  # every pod runs as "demo" (no API token mounted)

# Hardening for every pod in the release. nginx/redis images start as root,
# so the defaults stay root-compatible; the worker below opts into non-root.
defaults:
  podSecurityContext:
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false

apps:
  app:
    enabled: true
    replicas: 2
    image: nginx:1.27-alpine
    port: 80
    envFromConfigMap: true
    probes:
      readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
      livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    service:
      enabled: true
      port: 80
      portName: http

  worker:
    enabled: true
    image: busybox:1.36
    command: ["/bin/sh", "-c", "while true; do echo worker tick $(date); sleep 30; done"]
    # Per-app override: replaces defaults.* for this pod only
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534          # nobody
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
    resources:
      requests: { cpu: 10m, memory: 16Mi }
    # no service — workers are not addressed directly

  redis:
    enabled: true
    image: redis:7-alpine
    port: 6379
    resources:
      requests: { cpu: 50m, memory: 64Mi }
    service:
      enabled: true
      port: 6379
      portName: redis

  metrics-exporter:
    enabled: true
    image: oliver006/redis_exporter:v1.61.0
    port: 9121
    env:
      REDIS_ADDR: "redis://demo-redis:6379"
    resources:
      requests: { cpu: 10m, memory: 32Mi }
    service:
      enabled: true
      port: 9121
      portName: metrics

jobs:
  seed:
    enabled: true
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo seeding demo data... && sleep 2 && echo seed done"]
  migrate:
    enabled: true
    image: busybox:1.36
    hook: pre-install,pre-upgrade
    envFromSecret: true       # needs DB_PASSWORD — chart Secret is created first as a hook
    command: ["/bin/sh", "-c", "echo running DB migrations... && sleep 2 && echo migrations done"]

cronJobs:
  cleanup:
    enabled: true
    schedule: "*/2 * * * *"   # every 2 min so the first run is visible quickly
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo cleaning up stale demo data"]

serviceMonitor:
  enabled: true
  portName: metrics
  path: /metrics
  interval: 15s
  additionalLabels:
    release: kube-prometheus-stack

httpRoute:
  enabled: true
  parentName: platform-gateway
  parentNamespace: platform-gateway
  sectionName: http
  hostnames: [demo.local]
  backends:
    - { path: /, service: app, port: 80 }

backendTrafficPolicy:
  enabled: true
  # timeout: 5s   # EG >= 1.2 only — this cluster runs EG 1.1 where the field shape differs
  rateLimit:
    type: Local        # blocks without extra infra — good for the "actually blocks" test
    requests: 20
    unit: Minute

securityPolicy:
  enabled: true
  allowOrigins: ["http://demo.local"]

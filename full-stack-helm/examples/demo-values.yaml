# Demo release exercising every generic-chart feature at once.
#   helm upgrade --install demo ../generic-chart -n demo --create-namespace \
#     -f demo-values.yaml --set secrets.default.data.DB_PASSWORD=demopass
#   helm test demo -n demo
fullnameOverride: demo

# Release-wide image: every container that sets no image runs this one. Here
# it plays "our app's image" — the apps below run it with DIFFERENT commands
# (queue worker, scheduler, PVC writer), as one service's web/worker/scheduler
# usually do. nginx, redis and the exporter set their own image.
image: busybox:1.36

configMaps:
  default:                     # → ConfigMap "demo" — env vars
    enabled: true
    data:
      APP_ENV: demo
      LOG_LEVEL: info
  site:                        # → ConfigMap "demo-site" — a file, mounted into nginx
    enabled: true
    data:
      index.html: |
        <h1>generic-chart demo</h1>

secrets:
  default:                     # → Secret "demo"
    enabled: true
    data: {}                   # DB_PASSWORD comes from --set (never committed)

serviceAccount:
  create: true                 # every pod runs as "demo" (no API token mounted)

# Hardening for every pod in the release. nginx/redis images start as root,
# so the defaults stay root-compatible; the ticker below opts into non-root.
defaults:
  podSecurityContext:
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false

persistentVolumeClaims:
  data:                        # → PVC "demo-data", mounted by the ticker
    enabled: true
    size: 100Mi

apps:
  # --- Web: own image, HPA --------------------------------------------------
  default:                     # → Deployment + Service + HPA "demo"
    enabled: true
    containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
          - { name: http, containerPort: 80 }
        envFromConfigMaps: [default]
        volumeMounts:
          - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
        probes:
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 100m, memory: 128Mi }
    volumes:
      - { name: site, configMap: site }
    service:
      enabled: true
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

  # --- Same release image, different commands ------------------------------
  queue-worker:                # → Deployment + HPA "demo-queue-worker" (no Service)
    enabled: true
    replicas: 2                # starting point; the HPA takes over the count
    containers:
      - name: worker
        command: ["/bin/sh", "-c", "while true; do echo \"[$HOSTNAME] processing queue job\"; sleep 10; done"]
        envFromConfigMaps: [default]
        envFromSecrets: [default]
        resources:
          requests: { cpu: 20m, memory: 16Mi }
          limits: { cpu: 100m, memory: 32Mi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80

  scheduler:                   # → Deployment "demo-scheduler", fixed at 1 replica
    enabled: true
    replicas: 1                # a scheduler must not run twice, so no HPA
    strategy: { type: Recreate }   # never two schedulers during a rollout
    containers:
      - name: scheduler
        command: ["/bin/sh", "-c", "while true; do echo \"scheduler tick $(date)\"; sleep 60; done"]
        envFromConfigMaps: [default]
        resources:
          requests: { cpu: 10m, memory: 16Mi }

  ticker:                      # → Deployment "demo-ticker", writes to the shared PVC
    enabled: true
    replicas: 1                # ReadWriteOnce PVC: one pod (one node) at a time
    strategy: { type: Recreate }   # free the PVC before the new pod starts
    # Per-app override: replaces defaults.* for this pod only
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534          # nobody
      fsGroup: 65534            # makes the PVC writable for it
      seccompProfile: { type: RuntimeDefault }
    containers:
      - name: ticker
        command: ["/bin/sh", "-c", "while true; do date >> /data/ticks; sleep 30; done"]
        volumeMounts:
          - { name: data, mountPath: /data }
        resources:
          requests: { cpu: 10m, memory: 16Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
    volumes:
      - { name: data, pvc: data }

  # --- Stateful: own image, one PVC per pod -----------------------------------
  redis:                       # → StatefulSet + Service "demo-redis", with a metrics sidecar
    enabled: true
    kind: StatefulSet
    replicas: 1                # plain Redis doesn't replicate on its own: extra pods would be
                               # separate, empty Redises — so no HPA (use Redis Sentinel/Cluster)
    containers:
      - name: redis            # first container gets the persistence mount
        image: redis:7-alpine
        args: ["redis-server", "--appendonly", "yes"]   # args, not command: keeps the image entrypoint (drops root, owns /data)
        ports:
          - { name: redis, containerPort: 6379 }
        probes:
          readinessProbe: { exec: { command: [redis-cli, ping] }, initialDelaySeconds: 3, periodSeconds: 5 }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
      - name: exporter         # sidecar: same pod, reaches redis on localhost
        image: oliver006/redis_exporter:v1.61.0
        ports:
          - { name: metrics, containerPort: 9121 }
        env:
          REDIS_ADDR: "redis://localhost:6379"
        resources:
          requests: { cpu: 10m, memory: 32Mi }
    persistence:               # → PVC data-demo-redis-0 (survives restarts and upgrades)
      size: 256Mi
      mountPath: /data
    service:
      enabled: true            # ports redis + metrics, taken from both containers

jobs:
  seed:
    enabled: true
    containers:
      - name: seed             # no image → release-wide busybox
        command: ["/bin/sh", "-c", "echo seeding demo data... && sleep 2 && echo seed done"]
  migrate:
    enabled: true
    hook: pre-install,pre-upgrade
    containers:
      - name: migrate
        envFromSecrets: [default]   # needs DB_PASSWORD — the Secret is created first as a hook
        command: ["/bin/sh", "-c", "echo running DB migrations... && sleep 2 && echo migrations done"]

cronJobs:
  cleanup:
    enabled: true
    schedule: "*/2 * * * *"   # every 2 min so the first run is visible quickly
    containers:
      - name: cleanup
        command: ["/bin/sh", "-c", "echo cleaning up stale demo data"]

tests:
  connection:                  # helm test demo → Pod "demo-test-connection"
    enabled: true
    containers:
      - name: wget
        command: ["wget", "-qO-", "http://demo:80/"]

serviceMonitor:
  enabled: true
  portName: metrics            # the redis exporter sidecar's port
  path: /metrics
  interval: 15s
  additionalLabels:
    release: kube-prometheus-stack

httpRoutes:
  default:
    enabled: true
    parentRefs:
      - { name: platform-gateway, namespace: platform-gateway, sectionName: http }
    hostnames: [demo.local]
    rules:
      - matches:
          - path: { type: PathPrefix, value: / }
        backendRefs:
          - { service: default, port: 80 }

backendTrafficPolicies:
  default:
    enabled: true
    targetHttpRoutes: [default]
    rateLimit:
      type: Local              # blocks without extra infra — good for the "actually blocks" test
      local: { rules: [{ limit: { requests: 20, unit: Minute } }] }

securityPolicies:
  default:
    enabled: true
    targetHttpRoutes: [default]
    cors:
      allowOrigins: ["http://demo.local"]
      allowMethods: [GET, POST, PUT, DELETE]
      allowHeaders: [Authorization, Content-Type]

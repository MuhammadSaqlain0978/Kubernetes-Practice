# Frontend service (static React app on nginx) — ONE release of generic-chart.
# Owns "/" on the shared hostname; the backend release owns "/api". The browser
# calls /api on the same host, so the Gateway routes it straight to the backend.
#
#   helm upgrade --install frontend generic-chart -n fullstack --create-namespace \
#     -f examples/frontend-values.yaml
#
# Images: built from app/frontend and pushed to ECR (see commands.txt). For
# minikube, override with --set apps.web.image=full-stack-frontend:1.0
fullnameOverride: frontend

serviceAccount:
  create: true        # pods run as "frontend", no API token mounted

# nginx:alpine starts as root (binds :80, then drops to the nginx user for
# workers), so no runAsNonRoot / capability drop here — just block escalation.
defaults:
  podSecurityContext:
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false

apps:
  web:
    enabled: true
    replicas: 2
    image: 200268988035.dkr.ecr.us-west-1.amazonaws.com/eks_repo:frontend-1.0
    port: 80
    probes:
      readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 10 }
      livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10, periodSeconds: 20 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
    service:
      enabled: true
      port: 80
      portName: http

httpRoute:
  enabled: true
  parentName: platform-gateway
  parentNamespace: platform-gateway
  sectionName: http
  hostnames: [fullstack.local]
  backends:
    - { path: /, service: web, port: 80 }

backendTrafficPolicy:
  enabled: true
  timeout: 10s
  rateLimit:
    type: Local
    requests: 300       # static assets: more requests per page than the API
    unit: Minute

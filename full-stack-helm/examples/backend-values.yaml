# Backend service (API + its MongoDB) — one release of the central chart.
# The frontend is a separate release (frontend-values.yaml); both attach
# HTTPRoutes to the same platform Gateway/hostname: "/api" here, "/" there.
#
#   helm upgrade --install backend oci://<registry>/helm-charts/generic-chart --version 0.2.0 \
#     -n fullstack --create-namespace -f backend-values.yaml \
#     --set secrets.default.data.MONGO_PASSWORD=...
#   helm test backend -n fullstack
#
# Image: built from app/backend and pushed to ECR (see commands.txt). For
# minikube: --set image=full-stack-backend:1.0
fullnameOverride: backend      # application name → "default" keys are named just "backend"

image: 200268988035.dkr.ecr.us-west-1.amazonaws.com/eks_repo:backend-1.0

configMaps:
  default:                     # → ConfigMap "backend" (env for the API)
    enabled: true
    data:
      APP_NAME: "Generic Chart App"
      APP_ENV: "dev"
      BACKEND_PORT: "8000"
      MONGO_HOST: "backend-mongo"   # Service of apps.mongo below
      MONGO_USERNAME: "admin"       # non-secret default; password always via --set

secrets:
  default:                     # → Secret "backend"
    enabled: true
    data: {}                   # MONGO_PASSWORD via --set

# Production alternative to secrets.default: sync from AWS Secrets Manager
# (needs External Secrets Operator + a ClusterSecretStore). Disable
# secrets.default when enabling this, and use the key "default" here instead.
# externalSecrets:
#   default:
#     enabled: true
#     secretStoreRef: { name: aws-secrets-manager }
#     data:
#       - secretKey: MONGO_PASSWORD
#         remoteRef: { key: fullstack/backend, property: mongo_password }

serviceAccount:
  create: true                 # pods run as "backend", no API token mounted
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/backend   # IRSA, if the API needs AWS access

# Release-wide hardening (node runs fine as the image's "node" user, uid 1000)
defaults:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }

apps:
  default:                     # → Deployment + Service "backend"
    enabled: true
    revisionHistoryLimit: 3
    containers:
      - name: api
        ports:
          - { name: http, containerPort: 8000 }
        envFromConfigMaps: [default]   # APP_*, BACKEND_PORT, MONGO_HOST, MONGO_USERNAME
        envFromSecrets: [default]      # MONGO_PASSWORD
        probes:
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
    service:
      enabled: true
    hpa:                       # replaces a fixed replica count (needs metrics-server)
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

  mongo:                       # → StatefulSet + Service "backend-mongo"
    enabled: true
    kind: StatefulSet
    replicas: 1
    # Override: mongo's own user (999); fsGroup makes the PVC writable for it
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile: { type: RuntimeDefault }
    containers:
      - name: mongo
        image: mongo:7.0
        ports:
          - { name: mongo, containerPort: 27017 }
        envValueFrom:
          MONGO_INITDB_ROOT_USERNAME:
            configMapKeyRef: { name: backend, key: MONGO_USERNAME }
          MONGO_INITDB_ROOT_PASSWORD:
            secretKeyRef: { name: backend, key: MONGO_PASSWORD }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 1Gi }
    persistence:
      size: 1Gi
      mountPath: /data/db
    service:
      enabled: true

tests:
  health:                      # helm test backend → Pod "backend-test-health"
    enabled: true
    containers:
      - name: wget
        image: busybox:1.36
        command: ["wget", "-qO-", "http://backend:8000/api/health"]

httpRoutes:
  default:                     # → HTTPRoute "backend"
    enabled: true
    parentRefs:
      - { name: platform-gateway, namespace: platform-gateway, sectionName: http }
    hostnames: [fullstack.local]
    rules:
      - matches:
          - path: { type: PathPrefix, value: /api }
        backendRefs:
          - { service: default, port: 8000 }

backendTrafficPolicies:
  default:
    enabled: true
    targetHttpRoutes: [default]
    timeout: { http: { requestTimeout: 10s } }
    rateLimit:
      type: Local
      local: { rules: [{ limit: { requests: 100, unit: Minute } }] }

securityPolicies:
  default:
    enabled: true
    targetHttpRoutes: [default]
    cors:
      allowOrigins: ["http://fullstack.local"]
      allowMethods: [GET, POST, PUT, DELETE]
      allowHeaders: [Authorization, Content-Type]

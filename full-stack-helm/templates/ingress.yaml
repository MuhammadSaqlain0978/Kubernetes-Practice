{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    cert-manager.io/cluster-issuer:  {{ .Values.certManager.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}   #this is ingress controller, there are multiple classnames like traefik
  tls:
  - hosts:
      - {{ .Values.ingress.host }}

    secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.service.port }}  #must match with the backend service port, backend container's port in independent
{{- end }}

apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: api-rate-limit
  namespace: dev
spec:
  targetRef:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: full-stack-route
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: X-Forwarded-For
          limit:
            requests: 100
            unit: Minute
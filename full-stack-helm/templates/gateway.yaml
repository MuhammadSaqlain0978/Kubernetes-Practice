{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: my-gateway
  namespace: {{ .Release.Namespace }}

spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}

  listeners:

    - name: http
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: Same
{{- end }}

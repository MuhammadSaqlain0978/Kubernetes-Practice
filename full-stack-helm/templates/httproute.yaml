apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: full-stack-route
  namespace: dev

spec:
  parentRefs:
    - name: my-gateway
      sectionName: http

  hostnames:
    - {{ .Values.gateway.host | quote }}

  rules:

    - matches:
        - path:
            type: PathPrefix
            value: /api

      backendRefs:
        - name: backend
          port: 8000

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: frontend
          port: 80
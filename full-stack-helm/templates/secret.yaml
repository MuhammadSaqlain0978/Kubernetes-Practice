apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  MONGO_USERNAME: {{ required "mongodb.auth.username is required (pass with --set mongodb.auth.username=...)" .Values.mongodb.auth.username | quote }}
  MONGO_PASSWORD: {{ required "mongodb.auth.password is required (pass with --set mongodb.auth.password=...)" .Values.mongodb.auth.password | quote }}

apiVersion: v1
kind: Service

metadata:
  name: frontend

spec:
  # type: NodePort
  type: {{ .Values.frontend.service.type }} #changed to clusterip because i configured nginx now nginx will expose and single entry point
  

  selector:
    app: frontend

  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      # nodePort: 30080





